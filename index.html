<style>
:root{
  --bg:#F6EFE3;--card:#FFFFFF;--ink:#2B211C;--maroon:#7A2430;--gold:#C9A227;
  --terra:#B65C38;--teal:#2F6F6D;--border:#E3D5BE;--sand:#FBF6EC;--bad:#B23A3A;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1613;--card:#2A211D;--ink:#F3E9DC;--maroon:#D97D8A;--gold:#E3C158;
    --terra:#D98B62;--teal:#5FB3A9;--border:#3E322A;--sand:#251C18;--bad:#E07575;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1613;--card:#2A211D;--ink:#F3E9DC;--maroon:#D97D8A;--gold:#E3C158;
  --terra:#D98B62;--teal:#5FB3A9;--border:#3E322A;--sand:#251C18;--bad:#E07575;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--ink);min-height:100%;display:flex;flex-direction:column;align-items:center;padding:14px}
.wrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px}
.motif{height:8px;border-radius:4px;background:repeating-linear-gradient(135deg,var(--gold) 0 6px,var(--maroon) 6px 12px);opacity:.85}
header{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;text-align:center;box-shadow:0 10px 24px -10px rgba(122,36,48,.35)}
header h1{font-family:'Baloo 2','Segoe UI',system-ui,sans-serif;font-size:24px;font-weight:800;color:var(--maroon)}
header .school-name{font-size:9px;color:var(--maroon);font-weight:700;line-height:1.3;margin-bottom:4px;opacity:.85}
header .author-info{font-size:11px;color:var(--gold);font-weight:700;margin-top:4px}
header .sub{font-size:11px;opacity:.7;margin-top:4px}
.topbtns{display:flex;justify-content:center;gap:8px;margin-top:10px}
.pill{background:var(--sand);border:1px solid var(--border);color:var(--ink);padding:6px 10px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:5px;margin-top:10px}
.tab{flex:1;padding:10px 4px;border:none;background:transparent;border-radius:10px;font-weight:700;font-size:12px;color:var(--ink);cursor:pointer}
.tab.active{background:var(--maroon);color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;box-shadow:0 10px 24px -10px rgba(0,0,0,.15)}
.score{font-family:'Baloo 2','Segoe UI',system-ui,sans-serif;font-weight:800;font-size:15px;color:var(--gold)}
.emoji{font-size:60px}
.blanks{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.blank{width:38px;height:46px;border-bottom:4px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Baloo 2','Segoe UI',system-ui,sans-serif;font-size:22px;font-weight:800;color:var(--maroon)}
.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tile{width:58px;height:58px;border-radius:14px;border:2px solid var(--border);background:var(--sand);display:flex;align-items:center;justify-content:center;font-family:'Baloo 2','Segoe UI',system-ui,sans-serif;font-size:22px;font-weight:800;color:var(--terra);cursor:pointer;overflow:hidden;transition:transform .15s}
.tile:active{transform:scale(.92)}
.tile img{width:100%;height:100%;object-fit:contain;background:var(--card)}
.tile.used{opacity:.2;pointer-events:none}
.tile.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.tile.right{background:var(--teal);color:#fff;border-color:var(--teal)}
.tile.hint{box-shadow:0 0 0 4px var(--gold);animation:pulse .6s ease-in-out 2}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.hint{font-size:12px;opacity:.65}
.row{display:flex;gap:8px;width:100%}
.btn{flex:1;background:var(--maroon);color:#fff;border:none;padding:11px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer}
.btn.alt{background:var(--gold);color:var(--ink)}
.letters-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-height:360px;overflow-y:auto}
.gitem{background:var(--sand);border:1px solid var(--border);border-radius:12px;height:64px;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2','Segoe UI',system-ui,sans-serif;font-size:18px;font-weight:800;position:relative;overflow:hidden;cursor:pointer}
.gitem img{width:100%;height:100%;object-fit:contain;background:var(--card)}
.gitem.has::after{content:"✓";position:absolute;top:2px;right:4px;font-size:10px;color:var(--teal);background:#fff8;border-radius:6px;padding:0 2px}
.hidden{display:none!important}
input[type=file]{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal video{width:100%;max-width:400px;height:340px;object-fit:cover;border-radius:16px;border:3px solid var(--gold)}
.modal-box{background:var(--card);border:2px solid var(--gold);border-radius:18px;padding:20px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;text-align:left}
.modal-box h3{font-family:'Baloo 2','Segoe UI',system-ui,sans-serif;color:var(--maroon);font-size:17px;margin-bottom:10px}
.modal-box p{font-size:13px;line-height:1.5;margin-bottom:8px}
</style>
</head>

    <h1 id="title">Sözi Ýygna</h1>
